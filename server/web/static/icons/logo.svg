<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="메이플 수익 장부">
  <!-- 메이플 수익 장부 대표 그림: 가죽 장부 + 단풍잎 + 메소 동전 (테두리 없는 그림, 그라데이션 없음) -->
  <g stroke="#3d2418" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <!-- 장부 속지 (오른쪽·아래로 살짝 보이는 종이) -->
    <rect x="29" y="19" width="72" height="92" rx="9" fill="#fff3d6"/>
    <path d="M93 32v66M88 103H38" fill="none" stroke="#e8cfa0" stroke-width="3"/>
    <!-- 장부 표지 -->
    <rect x="19" y="11" width="72" height="92" rx="10" fill="#a65a31"/>
    <!-- 책등 -->
    <path d="M29 11h4v92h-4a10 10 0 0 1-10-10V21a10 10 0 0 1 10-10z" fill="#7d3f1f"/>
    <path d="M33 11v92" fill="none"/>
    <!-- 금속 모서리 -->
    <path d="M91 33V21a10 10 0 0 0-10-10H69z" fill="#ffc93c"/>
  </g>
  <!-- 표지 윤기 (밝은 띠) -->
  <path d="M40 17h28c-9 3-18 9-25 18-2 3-5 3-5 0V20c0-2 1-3 2-3z" fill="#c4774a"/>
  <!-- 단풍잎 (메이플 로고형: 똑바로 선 좌우 대칭 5갈래 + 곧은 줄기) -->
  <g transform="translate(36 30) scale(.52)">
    <path d="M50 60 V97" stroke="#3d2418" stroke-width="16" stroke-linecap="round"/>
    <g fill="#3d2418" stroke="#3d2418" stroke-width="10" stroke-linejoin="round"><path d="M50.0 54.0 Q78.4 29.5 50.0 5.0 Q21.6 29.5 50.0 54.0 Z"/><path d="M50.0 54.0 Q37.9 18.9 5.0 36.0 Q17.1 71.1 50.0 54.0 Z"/><path d="M50.0 54.0 Q82.9 71.1 95.0 36.0 Q62.1 18.9 50.0 54.0 Z"/><path d="M50.0 54.0 Q15.9 53.4 22.0 87.0 Q56.1 87.6 50.0 54.0 Z"/><path d="M50.0 54.0 Q43.9 87.6 78.0 87.0 Q84.1 53.4 50.0 54.0 Z"/></g>
    <path d="M50 60 V97" stroke="#f26b1d" stroke-width="6" stroke-linecap="round"/>
    <path d="M50.0 54.0 Q78.4 29.5 50.0 5.0 Q21.6 29.5 50.0 54.0 Z" fill="#ff8a2a"/><path d="M50.0 54.0 Q37.9 18.9 5.0 36.0 Q17.1 71.1 50.0 54.0 Z" fill="#ff8a2a"/><path d="M50.0 54.0 Q82.9 71.1 95.0 36.0 Q62.1 18.9 50.0 54.0 Z" fill="#ff8a2a"/><path d="M50.0 54.0 Q15.9 53.4 22.0 87.0 Q56.1 87.6 50.0 54.0 Z" fill="#ff8a2a"/><path d="M50.0 54.0 Q43.9 87.6 78.0 87.0 Q84.1 53.4 50.0 54.0 Z" fill="#ff8a2a"/>
    <clipPath id="leaf-right"><rect x="50" y="0" width="60" height="100"/></clipPath>
    <g clip-path="url(#leaf-right)" fill="#f26b1d"><path d="M50.0 54.0 Q78.4 29.5 50.0 5.0 Q21.6 29.5 50.0 54.0 Z"/><path d="M50.0 54.0 Q37.9 18.9 5.0 36.0 Q17.1 71.1 50.0 54.0 Z"/><path d="M50.0 54.0 Q82.9 71.1 95.0 36.0 Q62.1 18.9 50.0 54.0 Z"/><path d="M50.0 54.0 Q15.9 53.4 22.0 87.0 Q56.1 87.6 50.0 54.0 Z"/><path d="M50.0 54.0 Q43.9 87.6 78.0 87.0 Q84.1 53.4 50.0 54.0 Z"/></g>
    <g fill="none" stroke="#ffb469" stroke-width="3.2" stroke-linecap="round"><path d="M39.2 36.9 L43.1 18.7"/><path d="M30.3 57.6 L15.1 47.3"/><path d="M32.6 59.1 L25.0 73.6"/></g>
  </g>
  <!-- 메소 동전 (뒤 작은 것 + 앞 큰 것) -->
  <g stroke="#3d2418" stroke-width="5" stroke-linejoin="round">
    <circle cx="105" cy="104" r="14" fill="#f0a91f"/>
    <circle cx="91" cy="96" r="21" fill="#ffc93c"/>
    <circle cx="91" cy="96" r="12.5" fill="#ffd96b" stroke="#d98c12" stroke-width="3.5"/>
  </g>
  <path d="M84 91a8 8 0 0 1 6-5" fill="none" stroke="#fff6cf" stroke-width="3.5" stroke-linecap="round"/>
  <!-- 반짝 -->
  <path d="M111 14c1 6 3 8 9 9-6 1-8 3-9 9-1-6-3-8-9-9 6-1 8-3 9-9z" fill="#fff" stroke="#3d2418" stroke-width="3" stroke-linejoin="round"/>
</svg>
